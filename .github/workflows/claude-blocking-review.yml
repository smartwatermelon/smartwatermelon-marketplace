name: Claude Blocking Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  # Floating @v3, not a caller-level `if: github.actor !=
  # 'dependabot[bot]'` gate — a job-level `if:` prevents this job from
  # ever reporting on Dependabot PRs, which leaves a required status
  # check permanently pending. The reusable workflow skips Dependabot
  # PRs from inside the job instead, so it still reports PASS. See
  # smartwatermelon/github-workflows#115/#117.
  #
  # @v3 tracks the v3 major and is maintained at >= v3.1.0, so the
  # inside-the-job Dependabot skip above is always present. Floating the
  # major is deliberate: security fixes propagate by repointing one tag
  # in github-workflows instead of a PR in every consumer repo. The
  # previous exact @v3.1.0 pin silently opted this repo out of the
  # GHSA-8q5r-mmjf-575q remediation.
  claude-review:
    uses: smartwatermelon/github-workflows/.github/workflows/claude-blocking-review.yml@v3
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets:
      claude_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
